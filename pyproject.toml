[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gwflags"
version = "0.1.0"
description = "Quantum cohomology computations for flag varieties"
requires-python = ">=3.9"
dependencies = ["sympy>=1.10", "mpmath>=1.2"]

[tool.setuptools.packages.find]
include = ["gwflags*"]

[project.scripts]
gwflags = "gwflags.cli:main"
gwflags-gui = "gwflags.gui:main"
