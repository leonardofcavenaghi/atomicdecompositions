site_name: GEOATOMS
repo_url: https://github.com/leonardofcavenaghi/atomicdecompositions
theme:
  name: material
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  palette:
    scheme: default
    primary: blue grey
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - About: about.md
  - Installation: installation.md
  - How to Use: how-to-use.md
  - Catalog: catalog.md
  - Methodology: methodology.md
    - Lie Algebras Guide: lie-algebras.md
