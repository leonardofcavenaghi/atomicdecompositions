name: Test gwflags

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Select checks for changed files
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify documentation and software changes
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/classify_ci_changes.py

  python:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-test.txt

      - name: Run Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/ -q -m "not slow"

  python-slow:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Exact algebra regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-test.txt

      - name: Run exact algebra regressions
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/ -q -m slow

  catalog:
    name: Catalog and LaTeX validation
    needs: [changes, python, python-slow]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
          (needs.changes.outputs.full == 'false' ||
           (needs.python.result == 'success' && needs.python-slow.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-test.txt

      - name: Validate catalog source
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/validate_catalog.py

      - name: Validate exact computation data and catalog index
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/validate_localization_results.py

      - name: Validate exact saved toric records
        run: python scripts/validate_toric_results.py

      - name: Validate complete atomic and Hodge audit
        run: python scripts/validate_atomic_invariants.py

      - name: Validate additional homogeneous fourfolds
        run: python scripts/validate_flag_fourfolds.py

      - name: Validate saved regularized exponent multisets
        run: python scripts/validate_exponent_multisets.py

      - name: Verify explicit projective and bundle presentations
        run: python scripts/validate_geometric_presentations.py

      - name: Validate catalog LaTeX
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/validate_catalog_tex.py

      - name: Validate displayed spectra and Hodge diamonds
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/validate_catalog_math.py

  website:
    name: Documentation and browser regressions
    # Deployment waits for all jobs; website checks can run independently.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Validate repository organization and registrations
        run: python scripts/repository_catalog.py --check

      - name: Validate catalogue links and downloadable sources
        run: python scripts/validate_delivery.py

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Validate search metadata and withdrawn pages
        run: python scripts/validate_search_metadata.py

      - name: Validate package version and download documentation
        run: python scripts/validate_release_metadata.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install browser-test dependencies
        working-directory: scripts
        run: npm ci

      - name: Render all published equations before serving
        run: node scripts/render_static_math.js

      - name: Run catalog browser regression
        run: node scripts/test_catalog_navigation.js

      - name: Run GUI controls regression
        run: node scripts/test_gui_controls.js


  distributions:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Source distributions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and exercise every downloadable distribution
        run: python scripts/validate_distributions.py
