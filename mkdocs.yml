site_name: GEOATOMS
repo_name: leonardofcavenaghi/atomicdecompositions
repo_url: https://github.com/leonardofcavenaghi/atomicdecompositions
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.path
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About: about.md
  - Installation: installation.md
  - How to Use: how-to-use.md
  - Catalog: catalog.md
  - Methodology:
      - Core Theory: methodology.md
      - API Reference: api-reference.md
      - Lie Algebras Guide: lie-algebras.md
