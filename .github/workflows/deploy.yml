name: Deploy MkDocs to GitHub Pages

on:
  workflow_run:
    workflows: ["Test gwflags"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Deploy to GitHub Pages
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]; then
            echo "Skipping superseded documentation build: $VALIDATED_SHA"
            exit 0
          fi
          mkdocs build --strict
          python scripts/validate_search_metadata.py
          python scripts/validate_release_metadata.py
          mkdocs gh-deploy --force
