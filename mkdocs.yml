site_name: GEOATOMS
site_url: https://leonardofcavenaghi.github.io/atomicdecompositions/
site_description: 'Exact genus-zero localization software and a universal catalogue of varieties and complete intersections.'
repo_name: leonardofcavenaghi/atomicdecompositions
repo_url: https://github.com/leonardofcavenaghi/atomicdecompositions
edit_uri: edit/main/docs/

theme:
  color:
    primary: black
  name: material
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3

hooks:
  - scripts/search_keywords.py

plugins:
  - search

extra_javascript:
  - https://code.jquery.com/jquery-3.7.0.min.js
  - https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js
  - javascripts/catalog.js
  - javascripts/mathjax-loader.js

extra_css:
  - https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Catalogue:
      - All varieties: catalog/index.md
      - Notation: catalog/notation.md
      - Points and curves: catalog/points-curves.md
      - Surfaces: catalog/surfaces.md
      - Threefolds: catalog/threefolds.md
      - Fourfolds: catalog/fourfolds.md
      - Fivefolds: catalog/fivefolds.md
      - Higher dimensions: catalog/higher-dimensional.md
      - Projective constructions: catalog/projective.md
      - Grassmannian constructions: catalog/grassmannians.md
      - Homogeneous constructions: catalog/additional.md
      - Fano threefold reference: catalog/fanography.md
      - Sources and terminology: catalog/sources.md
      - Atomic invariants: catalog/atomic-invariants.md
      - Exact datasets: catalog/datasets.md
      - Original dataset usage: catalog/computed.md
  - Mathematics:
      - Localization on flag varieties: methodology.md
      - Root-system inputs: lie-algebras.md
      - Localization on toric varieties: toric/mathematics.md
  - Software:
      - Versions and scope: software/index.md
      - How to install: installation.md
      - Flag 1.0.6.dev0: software/flags-1.0.6.md
      - Flag 1.1.0.dev1: software/flags-1.1.0.md
      - Toric 1.1.0.dev1: software/toric-1.1.0.md
      - Combined 1.1.0.dev1: software/combined.md
      - Version comparison: software/launch-2026-11.md
      - Inputs and outputs: software/input-output.md
      - Notation and compatibility: software/notation.md
      - Version differences: software/changes.md
      - Preserved flag 1.0.5: software/flags-legacy.md
      - Python API: api-reference.md
      - Release notes: releases.md
      - Validation and reproducibility: software/launch-plan.md
  - Development:
      - Overview: development/index.md
      - Repository map: development/repository-map.md
      - Maintenance: development/maintenance.md
  - About: about.md
