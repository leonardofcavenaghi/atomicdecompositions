name: Test gwflags

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest mkdocs-material mkdocs pymdown-extensions mathjax

      - name: Run Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/ -q

      - name: Validate catalog source
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/validate_catalog.py

      - name: Validate catalog LaTeX
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/validate_catalog_tex.py

      - name: Build documentation strictly
        run: mkdocs build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install browser-test dependencies
        working-directory: scripts
        run: npm ci

      - name: Run catalog browser regression
        run: node scripts/test_catalog_navigation.js

      - name: Run GUI controls regression
        run: node scripts/test_gui_controls.js
