site_name: GEOATOMS
site_url: https://leonardofcavenaghi.github.io/atomicdecompositions/
site_description: 'GEOATOMS and gwflags: exact virtual localization for genus-zero Gromov-Witten invariants, small quantum multiplication, and a catalogue of Fano varieties and complete intersections in flag varieties.'
repo_name: leonardofcavenaghi/atomicdecompositions
repo_url: https://github.com/leonardofcavenaghi/atomicdecompositions
edit_uri: edit/main/docs/

theme:
  color:
    primary: black
  name: material
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_javascript:
  - https://code.jquery.com/jquery-3.7.0.min.js
  - https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js
  - javascripts/catalog.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Catalog:
      - Overview: catalog/index.md
      - Projective Spaces: catalog/projective.md
      - Grassmannians: catalog/grassmannians.md
      - Flag Varieties and Sections: catalog/additional.md
      - Download matrices and inputs: catalog/computed.md
      - Fano Threefolds: catalog/fanography.md
  - Software:
      - Installation: installation.md
      - User Guide: how-to-use.md
      - Python API: api-reference.md
      - Releases: releases.md
  - Mathematics:
      - Methods and Conventions: methodology.md
      - Flag Variety Inputs: lie-algebras.md
  - About: about.md
